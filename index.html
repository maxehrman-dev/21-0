<style>
:root {
  /* Night-game broadcast: ink field, chalk lines, stadium-light gold for the one thing that matters.
     Layout: sticky scoreboard header, then one working column of cards per screen. */
  --ink: #070c16;
  --panel: #0e1626;
  --panel2: #141e33;
  --raise: #1a2640;
  --line: #213049;
  --line2: #2e3f60;
  --chalk: #eef2f8;
  --muted: #8f9cb4;
  --gold: #f3b52f;
  --gold2: #ffd56a;
  --good: #3fc07f;
  --bad: #ef5b51;
  --warn: #e8a33c;
  --turf: #0c1d17;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --r: 12px;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -18px rgba(0,0,0,.8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--chalk); font-family: var(--body); font-size: 15px; line-height: 1.4; }
body { background: radial-gradient(1200px 500px at 70% -10%, rgba(243,181,47,.06), transparent 60%), var(--ink); min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { font-family: var(--display); letter-spacing: .015em; margin: 0; text-wrap: balance; text-transform: uppercase; font-weight: 800; }
h2 { font-size: 32px; line-height: 1; }
h3 { font-size: 19px; }
h4.sub { font-size: 15px; color: var(--muted); letter-spacing: .06em; margin: 18px 0 8px; display: flex; gap: 8px; align-items: baseline; }
h4.sub b { color: var(--chalk); font-size: 20px; }
.display { font-size: clamp(44px, 8vw, 76px); font-weight: 900; line-height: .9; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px 80px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .gold { color: var(--gold); } .bad { color: var(--bad); } .good { color: var(--good); } .warn { color: var(--warn); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; margin-top: 12px; }
.nowrap { flex-wrap: nowrap; }
.kicker { font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.lead { color: var(--muted); max-width: 64ch; line-height: 1.5; margin: 8px 0 0; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; letter-spacing: .01em;
  background: linear-gradient(180deg, var(--raise), var(--panel2)); border: 1px solid var(--line2); color: var(--chalk); box-shadow: 0 1px 0 rgba(255,255,255,.06) inset; transition: border-color .15s, transform .05s, filter .15s; white-space: nowrap; }
.btn:hover { border-color: #4a5d82; }
.btn:active { transform: translateY(1px); }
.btn.go { background: linear-gradient(180deg, var(--gold2), var(--gold)); border-color: #c98f12; color: #1b1203; font-weight: 700; box-shadow: 0 1px 0 rgba(255,255,255,.45) inset, 0 6px 18px -8px rgba(243,181,47,.6); }
.btn.go:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); box-shadow: none; }
.btn.ghost:hover { color: var(--chalk); background: var(--panel2); }
.btn.danger { color: var(--bad); border-color: rgba(239,91,81,.4); background: rgba(239,91,81,.06); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn.lg { height: 48px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
.btn.icon { width: 32px; padding: 0; }
.btn[disabled] { opacity: .4; cursor: not-allowed; filter: grayscale(.4); }
.sel { position: relative; display: inline-flex; }
.sel select { appearance: none; -webkit-appearance: none; height: 40px; padding: 0 36px 0 14px; border-radius: 10px; border: 1px solid var(--line2); color: var(--chalk); font: inherit; font-weight: 600; font-size: 14px;
  background: linear-gradient(180deg, var(--raise), var(--panel2)); box-shadow: 0 1px 0 rgba(255,255,255,.06) inset; cursor: pointer; max-width: 100%; }
.sel::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.sel select:hover { border-color: #4a5d82; }
.sel.sm select { height: 32px; font-size: 13px; padding: 0 30px 0 10px; border-radius: 8px; }
.sel.sm::after { right: 11px; width: 6px; height: 6px; }
.sel.lg select { height: 46px; font-size: 15px; min-width: 260px; }
.sel option { background: var(--panel2); color: var(--chalk); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); }
.seg button { height: 34px; padding: 0 14px; border-radius: 8px; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 14px; }
.seg button:hover { color: var(--chalk); }
.seg button.on { background: linear-gradient(180deg, var(--raise), var(--panel2)); color: var(--chalk); box-shadow: 0 0 0 1px var(--line2), 0 1px 0 rgba(255,255,255,.06) inset; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-weight: 600; font-size: 13px; }
.chip:hover { color: var(--chalk); border-color: var(--line2); }
.chip.on { background: var(--gold); border-color: var(--gold); color: #1b1203; }
.search input, .namefield input, textarea { height: 34px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel2); color: var(--chalk); font: inherit; padding: 0 10px; min-width: 0; }
.namefield input { height: 44px; font-family: var(--display); font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; width: min(360px, 70vw); background: transparent; border-color: transparent; padding: 0 6px; }
.namefield input:hover, .namefield input:focus { border-color: var(--line2); background: var(--panel2); }
textarea { width: 100%; height: 180px; padding: 10px; font-size: 13px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
.toolbar .meta { margin-left: auto; color: var(--muted); font-size: 13px; }
.toolbar .meta b { color: var(--chalk); }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.good { background: rgba(63,192,127,.12); color: var(--good); border-color: rgba(63,192,127,.3); }
.tag.bad { background: rgba(239,91,81,.12); color: var(--bad); border-color: rgba(239,91,81,.3); }
.tag.warn { background: rgba(232,163,60,.12); color: var(--warn); border-color: rgba(232,163,60,.3); }
.tag.gold { background: rgba(243,181,47,.12); color: var(--gold); border-color: rgba(243,181,47,.3); }

/* ---------- header ---------- */
header { position: sticky; top: 0; z-index: 10; background: rgba(7,12,22,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hbar { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.logo { background: none; border: 0; padding: 0; font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; color: var(--gold); }
.logo span { color: var(--chalk); }
.hteam { display: flex; align-items: center; gap: 10px; }
.hmeta { font-size: 13px; color: var(--muted); line-height: 1.25; display: flex; flex-direction: column; }
.hmeta b { color: var(--chalk); font-size: 15px; }
.hstats { display: flex; gap: 18px; }
.hright { margin-left: auto; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.capbox { margin-left: auto; min-width: 220px; }
.caprow { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.caprow b { color: var(--chalk); font-size: 14px; }
.capbar { height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-top: 5px; }
.capbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--good), #7fdcaa); }
.capbar.over i { background: var(--bad); }
nav.tabs { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { background: none; border: 0; color: var(--muted); height: 42px; padding: 0 14px; font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
nav.tabs button:hover { color: var(--chalk); }
nav.tabs button.on { color: var(--chalk); border-bottom-color: var(--gold); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--gold); color: #1b1203; font-size: 12px; font-weight: 800; display: inline-grid; place-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }

/* ---------- identity ---------- */
.badge { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 15px; color: #fff; border: 2px solid rgba(255,255,255,.18); flex: none; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.badge.sm { width: 26px; height: 26px; font-size: 11px; border-radius: 6px; border-width: 1px; }
.face { --s: 44px; width: var(--s); height: var(--s); border-radius: 50%; flex: none; background-color: #1d2a44; background-repeat: no-repeat; box-shadow: 0 0 0 2px var(--line2); display: inline-grid; place-items: center; }
.face.xs { --s: 24px; box-shadow: 0 0 0 1px var(--line2); }
.face.sm { --s: 34px; }
.face.xl { --s: 84px; box-shadow: 0 0 0 3px var(--line2); }
.face.ini { background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--tc) 85%, #fff 15%), var(--tc)); font-family: var(--display); font-weight: 800; font-size: calc(var(--s) * .38); color: #fff; }
.face.pk { background: var(--raise); font-family: var(--display); font-weight: 800; font-size: 12px; color: var(--gold); border-radius: 8px; }
.ovrb { min-width: 34px; height: 26px; padding: 0 6px; border-radius: 7px; display: inline-grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; background: var(--panel2); border: 1px solid var(--line); }
.ovrb.sm { min-width: 30px; height: 22px; font-size: 15px; }
.o90 { color: var(--gold); } .o80 { color: var(--good); } .o70 { color: var(--chalk); } .o0 { color: var(--muted); }
.pname { background: none; border: 0; padding: 0; color: var(--chalk); font-weight: 600; text-align: left; }
.pname:hover { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; }
.prow { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.pmain { flex: 1; min-width: 0; }
.pn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psub b { color: var(--chalk); font-weight: 600; }
.plist { display: grid; gap: 4px; }
.plist.scroll { max-height: 640px; overflow-y: auto; }
.trow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; }
.trow:hover { background: var(--panel2); }
.trow.sel { background: rgba(243,181,47,.06); border-color: rgba(243,181,47,.25); }
.trow.cut { cursor: pointer; }
.trow.cut input { width: 18px; height: 18px; accent-color: var(--gold); flex: none; }
.trow.fa { flex-wrap: wrap; }
.faact { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.pickno { font-family: var(--display); font-weight: 800; font-size: 16px; color: var(--muted); min-width: 34px; }
.amini { display: flex; align-items: center; gap: 8px; padding: 4px 0; min-width: 0; }
.amini .an { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }

/* ---------- layout ---------- */
.grid { display: grid; gap: 14px; }
.grid > * { min-width: 0; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.fa-grid { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
.card { background: linear-gradient(180deg, var(--panel), #0c1322); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.card h3 { margin-bottom: 12px; }
.cardh { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.cardh h3 { margin: 0; }
.hero { padding: 26px 0 14px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.hero.tight { padding-bottom: 12px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 6px 0 4px; }
.steps > div { border-left: 2px solid var(--gold); padding: 4px 0 4px 12px; }
.steps p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.divh { font-size: 17px; color: var(--muted); margin: 24px 0 10px; letter-spacing: .08em; }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.tcard { display: flex; gap: 12px; align-items: center; text-align: left; background: linear-gradient(180deg, var(--panel), #0c1322); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; transition: border-color .15s, transform .15s; }
.tcard:hover { border-color: var(--gold); transform: translateY(-1px); }
.tmid { flex: 1; min-width: 0; }
.tn { font-weight: 700; }
.ts { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ts b { color: var(--chalk); font-weight: 600; }
.to { display: flex; flex-direction: column; align-items: flex-end; }
.to b { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; }
.to span { font-size: 11px; color: var(--muted); }
.stepper { list-style: none; display: flex; gap: 6px; padding: 18px 0 0; margin: 0; overflow-x: auto; }
.stepper li { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; padding-right: 10px; }
.stepper li span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 1px solid var(--line2); }
.stepper li.done span { background: var(--good); border-color: var(--good); color: #062014; }
.stepper li.on { color: var(--chalk); font-weight: 600; }
.stepper li.on span { background: var(--gold); border-color: var(--gold); color: #1b1203; }
.stepper li + li::before { content: ""; width: 18px; height: 1px; background: var(--line2); margin-right: 4px; }

/* ---------- numbers ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
.kpis > div { display: flex; flex-direction: column; gap: 2px; }
.kpis b { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1; }
.kpis span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kpis em { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 700; display: block; }
.kpis em.up { color: var(--good); } .kpis em.down { color: var(--bad); }
.kpis.big b { font-size: 40px; }
.goal { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; background: rgba(243,181,47,.07); border: 1px solid rgba(243,181,47,.22); margin-bottom: 14px; }
.goal b { font-family: var(--display); font-size: 22px; text-transform: uppercase; }
.goalcard b { display: block; font-family: var(--display); font-size: 22px; text-transform: uppercase; margin: 4px 0 8px; }

/* ---------- needs ---------- */
.needs { display: grid; gap: 6px; }
.need { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); }
.need:hover { border-color: var(--line2); background: var(--raise); }
.ng { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 22px; flex: none; }
.gA { background: rgba(63,192,127,.15); color: var(--good); } .gB { background: rgba(243,181,47,.14); color: var(--gold); } .gC { background: rgba(143,156,180,.14); color: var(--chalk); }
.gD { background: rgba(232,163,60,.14); color: var(--warn); } .gF { background: rgba(239,91,81,.15); color: var(--bad); }
.nmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.nmain b { font-family: var(--display); font-size: 18px; width: 44px; }
.nmain .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nfaces { display: flex; }
.nfaces .face + .face { margin-left: -6px; }
.nright { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.depthmini { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.depthmini span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; }
.depthmini span.st { border-color: rgba(243,181,47,.4); }

/* ---------- lineup ---------- */
.fieldcard { padding-bottom: 10px; }
.field { border-radius: 10px; padding: 16px 8px; display: grid; gap: 14px; overflow-x: auto;
  background: repeating-linear-gradient(0deg, transparent 0 47px, rgba(255,255,255,.05) 47px 48px), linear-gradient(180deg, #0f251d, var(--turf)); border: 1px solid #173327; }
.frow { display: flex; justify-content: center; gap: 6px; min-width: max-content; }
.frow.left { justify-content: flex-start; }
.slot { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; background: rgba(7,12,22,.55); border: 1px solid rgba(255,255,255,.08); position: relative; }
.slot:hover { border-color: var(--gold); background: rgba(7,12,22,.8); }
.slot.weak .face { box-shadow: 0 0 0 2px var(--bad); }
.slot.empty { justify-content: center; min-height: 92px; border-style: dashed; }
.sovr { position: absolute; top: 4px; right: 4px; font-family: var(--display); font-weight: 800; font-size: 14px; background: var(--ink); border-radius: 5px; padding: 0 4px; line-height: 18px; }
.sname { font-size: 12px; font-weight: 600; max-width: 70px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slab { font-size: 10px; color: var(--muted); letter-spacing: .08em; font-weight: 700; }

/* ---------- offers and trades ---------- */
.offers { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.offer { border: 1px solid var(--line2); border-radius: 12px; padding: 12px; background: var(--panel2); }
.offer.slim { margin-bottom: 8px; }
.offerh { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.offerh > div { flex: 1; min-width: 0; }
.offerb { display: grid; grid-template-columns: 1fr; gap: 8px; }
.offerb > div { min-width: 0; }
.lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin-bottom: 2px; }
.dealbar { margin-bottom: 14px; position: sticky; top: 104px; z-index: 5; }
.dealtop { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.meterrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.meter { height: 10px; border-radius: 99px; background: var(--panel2); overflow: hidden; position: relative; margin: 10px 0; border: 1px solid var(--line); }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--bad); transition: width .25s; border-radius: 99px; }
.meter.close i { background: var(--warn); }

/* ---------- motion ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes sheetIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes sheetOut { to { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheetDown { to { transform: translateY(100%); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 16px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 10px); } }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.22); color: var(--gold); } 100% { transform: scale(1); } }
@keyframes stamp { 0% { opacity: 0; transform: scale(2.2) rotate(-8deg); } 60% { opacity: 1; transform: scale(.92) rotate(2deg); } 100% { opacity: 1; transform: none; } }
@keyframes popIn { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.06); } 100% { opacity: 1; transform: none; } }
@keyframes inL { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes inR { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes breathe { 0%, 100% { box-shadow: 0 0 0 5px var(--ink), 0 10px 24px -6px rgba(243,181,47,.6), 0 0 0 5px rgba(243,181,47,0); } 50% { box-shadow: 0 0 0 5px var(--ink), 0 10px 24px -6px rgba(243,181,47,.6), 0 0 0 11px rgba(243,181,47,.18); } }
@keyframes shine { 0% { background-position: -120% 0; } 60%, 100% { background-position: 220% 0; } }
@keyframes ringPulse { 0% { box-shadow: 0 0 0 0 rgba(243,181,47,.45); } 100% { box-shadow: 0 0 0 12px rgba(243,181,47,0); } }
.rise { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
.grow { transform-origin: left center; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: .15s; }
.modal { animation: fadeIn .18s ease-out both; }
.modal .sheet { animation: sheetIn .3s cubic-bezier(.2,.9,.3,1.15) both; }
.modal.still, .modal.still .sheet { animation: none; }
.modal.closing { animation: fadeOut .16s ease-in both; pointer-events: none; }
.modal.closing .sheet { animation: sheetOut .16s ease-in both; }
.toast { animation: toastIn .28s cubic-bezier(.2,.9,.3,1.2) both; }

.bump { display: inline-block; animation: bump .6s ease-out; }
.btn { transition: border-color .15s, transform .12s, box-shadow .2s, background .2s; }

.tcard, .offer, .need { transition: transform .18s ease, border-color .18s, box-shadow .18s; }

.perfect { background: linear-gradient(100deg, var(--gold) 30%, #fff3c4 50%, var(--gold) 70%) 0 0 / 220% 100%; animation: shine 3.2s ease-in-out infinite; }
.sheet .verdict, .sheet .vtag, .sheet .reveal + .tag { animation: stamp .45s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: 1.05s; }
.sheet .signhero > :first-child { animation: popIn .5s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: .1s; }
.sheet .tradedone > div:first-child { animation: inL .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: .12s; }
.sheet .tradedone > div:last-child { animation: inR .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: .2s; }
.sheet .resrow { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
.sheet .resrow:nth-child(2) { animation-delay: .06s; } .sheet .resrow:nth-child(3) { animation-delay: .12s; } .sheet .resrow:nth-child(4) { animation-delay: .18s; } .sheet .resrow:nth-child(n+5) { animation-delay: .24s; }
.count.pulse { animation: ringPulse 1.6s ease-out 2; }
/* sim reel: your games flash by after each sim */
.reel { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 50% 35%, rgba(22,32,61,.99), rgba(3,6,12,.995)); backdrop-filter: blur(8px); animation: fadeIn .2s ease-out both; cursor: pointer; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
